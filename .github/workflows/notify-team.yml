name: Notify Team on Push

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get commit info
        id: commit
        run: |
          echo "author=$(git log -1 --format='%an')" >> "$GITHUB_OUTPUT"
          echo "message<<EOF" >> "$GITHUB_OUTPUT"
          git log -1 --format='%B' >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git log -1 --format='%h')" >> "$GITHUB_OUTPUT"
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          git diff --name-only HEAD~1 HEAD 2>/dev/null || git log -1 --format='' --name-only >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Send notification email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: SimplifyOps <admin@simplifyops.dev>
          to: >-
            caleb@simplifyops.dev,
            lumi@simplifyops.dev,
            momoh@simplifyops.dev,
            paul@simplifyops.dev,
            sam@simplifyops.dev,
            samuel@simplifyops.dev,
            admin@simplifyops.dev,
            solomon@simplifyops.dev,
            zeph@simplifyops.dev
          subject: "[${{ steps.commit.outputs.sha_short }}] ${{ steps.commit.outputs.message }}"
          body: |
            New commit pushed to main by ${{ steps.commit.outputs.author }}

            ${{ steps.commit.outputs.message }}

            Files changed:
            ${{ steps.commit.outputs.files }}

            View commit: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          content_type: text/plain
