<!--
  SimplifyOps prototype hand-off email — v1

  WHEN TO USE

  Only after the lead has replied asking to see it. This is the ONLY email
  that carries the prototype link. It goes out as a reply on the existing
  thread, so the lead sees their own message quoted underneath — that context
  is what makes the link safe to click.

  Never send this cold. Never send it to a lead who has not asked.

  It is shorter than the first email because the pitch is already made. Give
  them the link, tell them what to poke at, offer the call, get out.

  PLACEHOLDERS
    {{FIRST_NAME}}   Chuck
    {{BUILT}}        what we built, same wording as the first email
    {{DEMO_URL}}     the published artifact link
    {{TRY_THIS}}     one concrete thing to poke at
                     e.g. "The contact form works, so send yourself one and see."
    {{SENDER}}       whoever is sending
-->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" bgcolor="#FFFFFF" style="border-collapse:collapse;background:#FFFFFF">
<tr>
<td align="left" style="padding:20px">

  <!--[if mso]>
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="560"><tr><td>
  <![endif]-->

  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;max-width:560px;border-collapse:collapse;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;color:#222222;text-align:left">

    <tr><td style="padding:0 0 16px;color:#222222">
      {{FIRST_NAME}},
    </td></tr>

    <tr><td style="padding:0 0 8px;color:#222222">
      Here it is &#8212; {{BUILT}}:
    </td></tr>

    <!-- demo link. on its own line so it's easy to find and tap -->
    <tr><td style="padding:0 0 16px">
      <a href="{{DEMO_URL}}" style="color:#1155CC;text-decoration:underline;font-weight:bold;font-size:16px">View the demo</a>
    </td></tr>

    <tr><td style="padding:0 0 16px;color:#222222">
      {{TRY_THIS}}
    </td></tr>

    <tr><td style="padding:0 0 16px;color:#222222">
      If you want to talk it through, <a href="https://calendar.app.google/aYy6MJaq9zJAm7nQ9" style="color:#1155CC;text-decoration:underline">grab fifteen minutes here</a>.
    </td></tr>

    <tr><td style="padding:0 0 24px;color:#222222">
      Either way, keep the build &#8212; no strings.
    </td></tr>

    <tr><td style="padding:0;color:#222222">
      {{SENDER}}<br>
      <span style="color:#666666">SimplifyOps</span>
    </td></tr>

  </table>
